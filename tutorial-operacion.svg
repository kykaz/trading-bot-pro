<svg width="1600" height="2200" viewBox="0 0 1600 2200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="2200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111B"/>
      <stop offset="1" stop-color="#0B1824"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 180) rotate(42) scale(520 340)">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320 240) rotate(90) scale(340 300)">
      <stop stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>
  <rect width="1600" height="2200" fill="url(#glowCyan)"/>
  <rect width="1600" height="2200" fill="url(#glowAmber)"/>

  <text x="120" y="120" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="6">TRADING BOT PRO</text>
  <text x="120" y="205" fill="#EDF5FB" font-family="Georgia, Times New Roman, serif" font-size="88" font-weight="700">Como operar el bot</text>
  <text x="120" y="290" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="30">Guia visual rapida para correrlo, leerlo y decidir que hacer despues.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="360" width="1360" height="240" rx="34" fill="#0C1C2A" stroke="#193448"/>
  </g>
  <text x="170" y="430" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="3">FLUJO MENTAL</text>
  <text x="170" y="505" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">1. Corre una ronda  2. Mira el estado  3. Lee setups  4. Confirma fills  5. Decide siguiente accion</text>
  <text x="170" y="555" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="26">Primero claridad. Luego detalle. Nunca al reves.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="670" width="650" height="300" rx="30" fill="#0D2232" stroke="#1E3A4E"/>
  </g>
  <text x="165" y="735" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">01</text>
  <text x="270" y="735" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Corre una ronda</text>
  <text x="165" y="805" fill="#89A8BD" font-family="Consolas, Courier New, monospace" font-size="28">python -m trading_bot.main run-once --source mock</text>
  <text x="165" y="855" fill="#89A8BD" font-family="Consolas, Courier New, monospace" font-size="28">python -m trading_bot.main run-once --source real</text>
  <text x="165" y="915" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="26">Usa `mock` para comprobar el flujo.</text>
  <text x="165" y="950" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="26">Usa `real` para mirar mercados publicos reales.</text>

  <g filter="url(#shadow)">
    <rect x="830" y="670" width="650" height="300" rx="30" fill="#0D2232" stroke="#1E3A4E"/>
  </g>
  <text x="875" y="735" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">02</text>
  <text x="980" y="735" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Mira la cabecera</text>
  <text x="875" y="810" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="28">Estado de mesa</text>
  <text x="875" y="850" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="26">Te dice si esta activo, observando o quieto.</text>
  <text x="875" y="905" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="28">Sesgo actual</text>
  <text x="875" y="945" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="26">Te orienta rapido: comprador, vendedor o balanceado.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="1030" width="650" height="380" rx="30" fill="#0D2232" stroke="#1E3A4E"/>
  </g>
  <text x="165" y="1095" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">03</text>
  <text x="270" y="1095" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Lee el Tablero de accion</text>
  <text x="165" y="1165" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="26">Aqui estan los setups mas recientes.</text>
  <text x="165" y="1210" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="25">Busca estas tres cosas:</text>
  <text x="190" y="1260" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Direccion:</text>
  <text x="340" y="1260" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="24">setup largo o setup corto</text>
  <text x="190" y="1305" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Confianza:</text>
  <text x="340" y="1305" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="24">que tan fuerte ve la oportunidad</text>
  <text x="190" y="1350" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Edge:</text>
  <text x="340" y="1350" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="24">cuanto valor esperado cree que hay</text>

  <g filter="url(#shadow)">
    <rect x="830" y="1030" width="650" height="380" rx="30" fill="#0D2232" stroke="#1E3A4E"/>
  </g>
  <text x="875" y="1095" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">04</text>
  <text x="980" y="1095" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Confirma la Cinta de ejecucion</text>
  <text x="875" y="1165" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="26">Esto ya no es intencion. Esto si se hizo.</text>
  <text x="875" y="1210" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="25">Mira:</text>
  <text x="900" y="1260" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Precio</text>
  <text x="900" y="1305" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Tamano</text>
  <text x="900" y="1350" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Nocional</text>
  <text x="900" y="1395" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="24">• Fee</text>

  <g filter="url(#shadow)">
    <rect x="120" y="1470" width="1360" height="300" rx="30" fill="#0D2232" stroke="#1E3A4E"/>
  </g>
  <text x="165" y="1535" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">05</text>
  <text x="270" y="1535" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Toma la decision correcta</text>
  <text x="165" y="1610" fill="#22C55E" font-family="Segoe UI, Arial, sans-serif" font-size="28">Si ves:</text>
  <text x="290" y="1610" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="28">estado activo + setups claros + fills coherentes</text>
  <text x="165" y="1655" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="26">Entonces el flujo esta sano y puedes seguir probando.</text>
  <text x="165" y="1710" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="28">Si ves:</text>
  <text x="290" y="1710" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="28">muchas senales sin fills, o fills raros, o PnL erratico</text>
  <text x="165" y="1755" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="26">Entonces toca ajustar estrategia, riesgo o fuente de datos.</text>

  <g filter="url(#shadow)">
    <rect x="120" y="1830" width="1360" height="230" rx="30" fill="#0C1C2A" stroke="#193448"/>
  </g>
  <text x="165" y="1895" fill="#EDF5FB" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Regla principal</text>
  <text x="165" y="1955" fill="#89A8BD" font-family="Segoe UI, Arial, sans-serif" font-size="28">Hoy esto se opera como sistema de prueba. Todavia no como bot con dinero real.</text>
  <text x="165" y="2005" fill="#22D3EE" font-family="Consolas, Courier New, monospace" font-size="26">Web: https://trading-bot-pro.vercel.app</text>

  <text x="120" y="2145" fill="#6B859A" font-family="Segoe UI, Arial, sans-serif" font-size="22">Tutorial visual generado dentro del proyecto para uso operativo rapido.</text>
</svg>
