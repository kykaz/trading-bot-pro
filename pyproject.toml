[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-pro"
version = "0.1.0"
description = "Professional foundation for a prediction-market trading bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" }
]
dependencies = [
  "alpaca-py>=0.43.2,<0.44",
  "MetaTrader5>=5.0.5735,<5.1; platform_system == 'Windows'",
]

[project.scripts]
trading-bot = "trading_bot.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
